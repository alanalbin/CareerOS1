<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <!-- Background transparent -->
  
  <!-- Dark grey circle - the C letterform -->
  <circle cx="46" cy="50" r="44" fill="#3a3a3a"/>
  
  <!-- White inner circle (creates the C opening) -->
  <circle cx="58" cy="50" r="24" fill="white"/>
  
  <!-- White rect to open right side of C -->
  <rect x="58" y="28" width="35" height="44" fill="white"/>
  
  <!-- "os." text in dark green, bold -->
  <text x="90" y="72" 
        font-family="Arial Black, 'Arial Bold', Gadget, sans-serif" 
        font-size="52" 
        font-weight="900" 
        fill="#2d6e1b"
        letter-spacing="-1">os.</text>
  
  <!-- "career OS" subtitle below in dark grey -->
  <text x="92" y="87" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        fill="#3a3a3a"
        letter-spacing="0.5">career OS</text>
</svg>
